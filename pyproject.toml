[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-parachute"
version = "0.1.2"
description = "A safety net for Claude Code: shadow-git snapshots that capture even Bash changes /rewind misses, plus a one-pull restore and a kill switch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jack Bhanded" }]
keywords = ["claude", "claude-code", "anthropic", "git", "checkpoint", "rollback", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
gui = ["PySide6>=6.5"]

[project.scripts]
parachute = "claude_parachute.cli:main"

[project.urls]
Homepage = "https://github.com/JackBhanded/claude-parachute"
Repository = "https://github.com/JackBhanded/claude-parachute"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
